name: Build - Web
on: workflow_call

jobs:
  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install Emscripten
        working-directory: /tmp
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth=1
          cd emsdk
          ./emsdk install 5.0.2
          ./emsdk activate 5.0.2

      - name: Build
        run: |
          source /tmp/emsdk/emsdk_env.sh
          emcc -v
          emcmake cmake -B build -G Ninja -DNO_NETWORK=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target smw

      - name: Package
        run: |
          mkdir supermariowar-web
          cp build/smw.html build/smw.js build/smw.wasm build/smw.data supermariowar-web/
          cp build/smw.html supermariowar-web/index.html
          zip -9 -r "supermariowar_$(date +%F)_web.zip" supermariowar-web

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: supermariowar_web
          path: supermariowar_*_web.zip
