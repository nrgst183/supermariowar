name: Build - Windows
on: workflow_call

env:
  COMMON_CMAKE_ARGS: >-
    -B build
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DSMW_INSTALL_PORTABLE=ON

jobs:
  msvc:
    name: MSVC
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla/sccache-action@v0.0.9

      - name: Download dependencies
        run: |
          mkdir libs
          curl -L https://www.libsdl.org/release/SDL3-devel-3.4.18-VC.zip | tar -x --strip-components=1 -C libs
          curl -L https://www.libsdl.org/projects/SDL_image/release/SDL3_image-devel-3.4.8-VC.zip | tar -x --strip-components=1 -C libs
          curl -L https://www.libsdl.org/projects/SDL_mixer/release/SDL3_mixer-devel-3.2.4-VC.zip | tar -x --strip-components=1 -C libs
          mkdir build
          cp libs/lib/x64/*.dll build/

      - name: Configure
        shell: bash
        run: cmake $COMMON_CMAKE_ARGS
          -DCMAKE_PREFIX_PATH=libs
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --verbose --config Release --parallel

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure --build-config Release

      - name: Package
        shell: bash
        run: |
          cmake --install build --prefix supermariowar --strip --config Release
          rm -rf supermariowar/include supermariowar/lib
          cp libs/lib/x64/*.dll supermariowar/
          7z a "supermariowar_$(date +%F)_windows.zip" supermariowar

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: supermariowar_windows
          path: supermariowar_*_windows.zip

  vs-solution:
    name: Visual Studio solution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # Same path a developer takes locally: generate the solution with the
      # newest installed Visual Studio and let CMake build the bundled
      # dependencies (SDL3, SDL3_image, SDL3_mixer, enet, toml11, zlib).
      - name: Generate solution
        shell: cmd
        run: generate-vs-solution.bat

      - name: Build (Debug)
        run: cmake --build build/vs --config Debug --parallel

      - name: Test (Debug)
        run: ctest --test-dir build/vs/tests --build-config Debug --output-on-failure
