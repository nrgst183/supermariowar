name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  build-linux:
    if: &should-run >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Linux
    uses: ./.github/workflows/build_linux.yml

  build-macos:
    if: *should-run
    name: macOS
    uses: ./.github/workflows/build_macos.yml

  build-windows:
    if: *should-run
    name: Windows
    uses: ./.github/workflows/build_windows.yml

  build-emcc:
    if: *should-run
    name: Web
    uses: ./.github/workflows/build_emcc.yml

  build-android:
    if: *should-run
    name: Android
    uses: ./.github/workflows/build_android.yml

  # Publishes the build artifacts:
  #  - pushing a tag like `v2.1.0` creates the GitHub release "v2.1.0"
  #    (tags with a suffix such as `v2.1.0-beta.1` become pre-releases)
  #  - every push to the default branch refreshes the `continuous` pre-release
  publish:
    name: Publish release
    needs: [build-linux, build-macos, build-windows, build-emcc]
    if: >
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: supermariowar_*
          path: dist
          merge-multiple: true

      - name: Name packages
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="continuous"
          fi
          # supermariowar_<date>_<platform>.zip -> supermariowar_<version>_<platform>.zip
          for f in dist/supermariowar_*.zip; do
            platform="${f##*_}"
            mv "$f" "dist/supermariowar_${VERSION}_${platform}"
          done
          ls -l dist

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --verify-tag \
            --title "Super Mario War $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease

      - name: Update continuous release
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          gh release delete continuous --yes --cleanup-tag || true
          gh release create continuous dist/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Continuous build" \
            --notes "Automatic build of $GITHUB_SHA (${GITHUB_REF_NAME}). For stable versions, see the tagged releases."
